
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>On-a-Trip Holidays | India Tour Packages & Travel</title>

    <meta
      name="description"
      content="On-a-Trip Holidays offers unforgettable India tour packages, hotel bookings, transportation and flight bookings. Explore India's best destinations with us."
    />

    <meta
      name="keywords"
      content="On-a-Trip Holidays, India tour packages, holiday packages India, travel agency India, India holidays, tour packages, hotel booking, flight booking, travel packages"
    />

    <meta name="author" content="On-a-Trip Holidays" />

    <!-- Search Engine -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://ona-trip-holiday.vercel.app/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://ona-trip-holiday.vercel.app/"
    />
    <meta
      property="og:title"
      content="On-a-Trip Holidays | Explore India"
    />
    <meta
      property="og:description"
      content="Discover unforgettable destinations across India with On-a-Trip Holidays. Explore tour packages, hotels, transportation and flight bookings."
    />
    <meta
      property="og:image"
      content="https://ona-trip-holiday.vercel.app/images/og-image.jpg"
    />
    <meta
      property="og:image:alt"
      content="On-a-Trip Holidays - Explore India"
    />
    <meta property="og:site_name" content="On-a-Trip Holidays" />

    <!-- Instagram -->
    <meta
      property="og:see_also"
      content="https://www.instagram.com/onatripholidays"
    />

    <!-- Facebook -->
    <meta
      property="og:see_also"
      content="https://www.facebook.com/p/Onatrip-Holidays-100088055905534/"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="On-a-Trip Holidays | Explore India"
    />
    <meta
      name="twitter:description"
      content="Explore India's best destinations with On-a-Trip Holidays."
    />
    <meta
      name="twitter:image"
      content="https://ona-trip-holiday.vercel.app/images/og-image.jpg"
    />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
